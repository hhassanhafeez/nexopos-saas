services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: nexopos_app
    restart: always
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./public/build:/var/www/public/build
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexopos
    environment:
      - APP_ENV=production

  nginx:
    image: nginx:1.25-alpine
    container_name: nexopos_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/public/storage:ro
      - ./docker/nginx/nip.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nexopos

  mysql:
    image: mysql:8.0
    container_name: nexopos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexopos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexopos_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nexopos
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: nexopos_queue
    restart: always
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/storage
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexopos
    environment:
      - APP_ENV=production

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: nexopos_reverb
    restart: always
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/var/www/storage
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexopos
    environment:
      - APP_ENV=production

networks:
  nexopos:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
