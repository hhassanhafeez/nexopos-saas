services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nexopos_app
    restart: no
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexopos
    environment:
      - APP_ENV=local

  nginx:
    image: nginx:1.25-alpine
    container_name: nexopos_nginx
    restart: no
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nexopos

  mysql:
    image: mysql:8.0
    container_name: nexopos_mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nexopos_central
      MYSQL_USER: nexopos
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - nexopos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexopos_redis
    restart: no
    volumes:
      - redis_data:/data
    ports:
      - "63790:6379"
    networks:
      - nexopos
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nexopos_queue
    restart: no
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexopos

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nexopos_reverb
    restart: no
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexopos

  node:
    image: node:24-alpine
    container_name: nexopos_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "3331:3331"
    command: sh -c "npm install && npm run dev"
    networks:
      - nexopos
    environment:
      - VITE_DOCKER=true

networks:
  nexopos:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
